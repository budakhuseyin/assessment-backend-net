name: CI Pipeline

# Her push ve pull request'te otomatik olarak tetiklenir
on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # 1. Kaynak kodu checkout et
      - name: Kodu İndir (Checkout)
        uses: actions/checkout@v4

      # 2. .NET 8 SDK'yı kur
      - name: .NET 8 SDK Kurulumu
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3. Bağımlılıkları yükle (restore)
      - name: Bağımlılıkları Yükle
        run: dotnet restore ArasContactDirectory.sln

      # 4. Tüm testleri çalıştır (build + test tek adımda)
      # --no-build kaldırıldı: GitHub SDK 10.x ile DLL yolu uyumsuzluğunu önlemek için
      - name: Testleri Çalıştır (Birim + Integration)
        run: dotnet test ArasContactDirectory.sln --configuration Release --verbosity normal
